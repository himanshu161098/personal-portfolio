<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="prachiBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8a2be2" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Prismatic Vibrant Multi-stop Gradients -->
    <linearGradient id="prachiGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="25%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="75%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <linearGradient id="prachiGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="35%" stop-color="#ff007f"/>
      <stop offset="70%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="prachiStarGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="prachiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="prachiSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background aura -->
  <circle cx="256" cy="256" r="230" fill="url(#prachiBgGlow)"/>

  <!-- Orbital Cyber Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#prachiGradMain)" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.4" filter="url(#prachiSoftGlow)"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#prachiGradSecondary)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>

  <!-- Neural Constellation Network Nodes -->
  <g opacity="0.65" stroke="url(#prachiGradMain)" stroke-width="1.5">
    <line x1="256" y1="90" x2="330" y2="130"/>
    <line x1="330" y1="130" x2="385" y2="200"/>
    <line x1="385" y1="200" x2="370" y2="290"/>
    <line x1="370" y1="290" x2="300" y2="340"/>
    <line x1="300" y1="340" x2="230" y2="340"/>
    <line x1="230" y1="340" x2="270" y2="245"/>
    <line x1="270" y1="245" x2="330" y2="130"/>
  </g>
  <g fill="#00f2fe" filter="url(#prachiSoftGlow)">
    <circle cx="256" cy="90" r="4.5" fill="#ffffff"/>
    <circle cx="330" cy="130" r="5" fill="#00f2fe"/>
    <circle cx="385" cy="200" r="4.5" fill="#ff007f"/>
    <circle cx="370" cy="290" r="5.5" fill="#ffaa00"/>
    <circle cx="300" cy="340" r="4" fill="#00f2fe"/>
    <circle cx="230" cy="340" r="4.5" fill="#8a2be2"/>
  </g>

  <!-- Futuristic Holographic Stylized 'P' Monogram -->
  <g filter="url(#prachiGlow)">
    <!-- Back Spine Stem of P -->
    <path d="M145 110 C 145 95, 160 85, 180 85 L 290 85 C 375 85, 425 135, 425 215 C 425 295, 365 340, 275 340 L 225 340 C 215 340, 210 345, 205 355 L 165 425 C 155 440, 135 440, 130 425 C 125 410, 140 375, 145 350 Z" 
          fill="none" stroke="url(#prachiGradMain)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Inner Flowing Stream of P -->
    <path d="M165 115 L 270 115 C 335 115, 380 155, 380 215 C 380 275, 335 305, 270 305 L 210 305" 
          fill="none" stroke="url(#prachiGradSecondary)" stroke-width="14" stroke-linecap="round"/>

    <!-- Dynamic Diagonal Cyber Swoosh on P Stem -->
    <path d="M140 185 L 220 185 C 235 185, 245 195, 240 210 L 220 270 C 215 285, 200 295, 185 295 L 140 295"
          fill="url(#prachiGradSecondary)" opacity="0.35"/>
  </g>

  <!-- Prismatic AI Starburst Core inside the P Loop -->
  <g transform="translate(280, 215)" filter="url(#prachiGlow)">
    <!-- Star Points (5-Point Multi-Spectrum Star) -->
    <polygon points="0,-68 20,-22 68,-22 28,10 44,56 0,26 -44,56 -28,10 -68,-22 -20,-22" 
             fill="url(#prachiStarGrad)" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- Central Supernova Sparkle -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" filter="url(#prachiSoftGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#00f2fe"/>

    <!-- Radiant Light Rays -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#ff007f" stroke-width="1.8" opacity="0.75"/>
    <line x1="50" y1="-50" x2="-50" y2="50" stroke="#00f2fe" stroke-width="1.8" opacity="0.75"/>
  </g>

  <!-- Micro AI Sparkles in surrounding space -->
  <g fill="#ffffff" opacity="0.85" filter="url(#prachiSoftGlow)">
    <!-- Sparkle 1 -->
    <path d="M125 150 Q 125 165 140 165 Q 125 165 125 180 Q 125 165 110 165 Q 125 165 125 150 Z" fill="#00f2fe"/>
    <!-- Sparkle 2 -->
    <path d="M410 120 Q 410 132 422 132 Q 410 132 410 144 Q 410 132 398 132 Q 410 132 410 120 Z" fill="#ff007f"/>
    <!-- Sparkle 3 -->
    <path d="M375 380 Q 375 390 385 390 Q 375 390 375 400 Q 375 390 365 390 Q 375 390 375 380 Z" fill="#ffaa00"/>
    <!-- Sparkle 4 -->
    <path d="M190 440 Q 190 448 198 448 Q 190 448 190 456 Q 190 448 182 448 Q 190 448 190 440 Z" fill="#00f2fe"/>
  </g>
</svg>
