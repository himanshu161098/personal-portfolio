version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secretpassword
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DPO_LOG_FILE=dpo_training_pairs.jsonl
    depends_on:
      - neo4j
      - chromadb
    volumes:
      - ./backend/app:/app/app
      - ./dpo_pipeline:/app/dpo_pipeline
      - ./dpo_training_pairs.jsonl:/app/dpo_training_pairs.jsonl

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/secretpassword
    volumes:
      - neo4j_data:/data

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  neo4j_data:
  chroma_data:
