# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI Code Review & Security Configuration for Personal Portfolio
language: "en-US"
tone_instructions: "You are a senior frontend and cybersecurity expert reviewing Himanshu's Personal Portfolio. Focus on XSS prevention, Content Security Policy, asset optimization, responsiveness, 3D WebGL performance, and Cloudflare Worker security."

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
    biome:
      enabled: true
  path_instructions:
    - path: "worker/**"
      instructions: "Audit Cloudflare Worker proxy for CORS origin validation, rate limiting, and API key isolation. Ensure no secrets are leaked to the client."
    - path: "*.js"
      instructions: "Verify DOM manipulation does not expose XSS vulnerabilities. Ensure Three.js / WebGL context loss handlers are clean."
    - path: "*.html"
      instructions: "Check for valid semantic markup, accessibility (ARIA), SEO meta tags, and secure external resources (integrity/subresource integrity)."

chat:
  auto_reply: true
